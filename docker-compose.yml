# SimpleStock — 개인 자산 추적
# 사용: docker compose up -d
# 접속: http://localhost:50000 (simpleStock 기본 포트; .env의 PORT로 변경 가능)

services:
  app:
    build:
      context: .
      args:
        # 통합 nginx 게이트웨이 뒤에 둘 때 prefix(/simpleStock) 를 빌드 타임에 주입.
        # 단독 실행 시에는 빈 값으로 두면 / 루트로 동작.
        VITE_BASE_PATH: "${VITE_BASE_PATH:-}"
    image: simple-stock-app
    ports:
      - "${PORT:-50000}:${PORT:-50000}"
    volumes:
      - ./data:/app/data
    # 🔐 토스증권 자격증명 — 저장소 밖(/etc, 640 root:seunghyun)에 둔다.
    #    저장소 .env 에 넣으면 형상·백업으로 퍼진다(2026-09-21).
    #    ⚠️ 파일이 없으면 compose 가 기동을 거부한다 — required:false 로 둬서
    #       자격증명 없이도 기존 프로바이더로 돌 수 있게 한다(isEnabled()=false).
    env_file:
      - path: /etc/simplestock.env
        required: false
    # 🔴 컨테이너에서 호스트(.25)의 my-computer MCP 를 부르기 위해 (2026-09-21)
    #    컨테이너 안의 127.0.0.1 은 **자기 자신**이라 MYCOMPUTER_MCP_URL 이 안 닿는다
    #    (실측: fetch failed). 도커 게이트웨이(172.18.0.1)나 LAN IP 로도 닿지만
    #    ⚠️ 게이트웨이 IP 는 네트워크 재생성 시, LAN IP 는 공유기 설정에 따라 바뀐다.
    #    ⇒ 이름으로 고정한다. host-gateway 는 도커가 호스트 주소로 채워 준다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "${PORT:-50000}"
      APP_ACCESS_TOKEN: "${APP_ACCESS_TOKEN:-}"
      LOG_REQUEST_BODY: "${LOG_REQUEST_BODY:-false}"
      TZ: "${TZ:-Asia/Seoul}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Seoul}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_GATEWAY_BASE_URL: "${GEMINI_GATEWAY_BASE_URL:-}"
      GEMINI_GATEWAY_TOKEN: "${GEMINI_GATEWAY_TOKEN:-}"
      GEMINI_SERVICE_ID: "${GEMINI_SERVICE_ID:-simpleStock}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash}"
      GEMINI_SUPERVISOR_MODEL: "${GEMINI_SUPERVISOR_MODEL:-gemini-3.5-flash}"
      GEMINI_INCLUDE_THOUGHTS: "${GEMINI_INCLUDE_THOUGHTS:-false}"
      GEMINI_THINKING_BUDGET: "${GEMINI_THINKING_BUDGET:-1024}"
      GEMINI_TIMEOUT_MS: "${GEMINI_TIMEOUT_MS:-120000}"
      GEMINI_SUPERVISOR_TIMEOUT_MS: "${GEMINI_SUPERVISOR_TIMEOUT_MS:-90000}"
      GEMINI_MAX_RETRIES: "${GEMINI_MAX_RETRIES:-2}"
      GEMINI_RETRY_BASE_MS: "${GEMINI_RETRY_BASE_MS:-1500}"
      MANAGER_BRIEF_PRESET_SCHEDULE: "${MANAGER_BRIEF_PRESET_SCHEDULE:-true}"
      AI_DAILY_CRON: "${AI_DAILY_CRON:-}"
      # ── my-computer MCP (시장 웹 검색) — **여기에 적지 않는다** ────
      # 🔴 `environment:` 에 `${VAR:-}` 로 적으면 **`env_file` 값을 빈 값으로 덮어쓴다**
      #    (실측: docker compose config 로 확인 — SECRET_A 가 "" 가 됐다).
      #    MYCOMPUTER_MCP_{ENABLED,URL,TOKEN,TIMEOUT_MS} 는 TOSS_* 와 같이
      #    **/etc/simplestock.env 에만** 둔다. 여기 적는 순간 토큰이 조용히 사라진다.
      #    URL 은 `http://host.docker.internal:28080/my-computer/mcp` (위 extra_hosts 참조)
      MARKET_DATA_ENABLED: "${MARKET_DATA_ENABLED:-true}"
      MARKET_DATA_PROVIDER: "${MARKET_DATA_PROVIDER:-finnhub}"
      MARKET_US_PROVIDER: "${MARKET_US_PROVIDER:-finnhub}"
      MARKET_KR_PROVIDER: "${MARKET_KR_PROVIDER:-myapi}"
      MARKET_FX_PROVIDER: "${MARKET_FX_PROVIDER:-yahoo-finance}"
      MARKET_REFRESH_INTERVAL_MS: "${MARKET_REFRESH_INTERVAL_MS:-60000}"
      MARKET_QUOTE_TTL_MS: "${MARKET_QUOTE_TTL_MS:-60000}"
      MARKET_KR_QUOTE_TTL_MS: "${MARKET_KR_QUOTE_TTL_MS:-21600000}"
      MARKET_KR_BAS_DT_LOOKBACK_DAYS: "${MARKET_KR_BAS_DT_LOOKBACK_DAYS:-2}"
      MARKET_KR_QUOTA_BACKOFF_MS: "${MARKET_KR_QUOTA_BACKOFF_MS:-1800000}"
      MYAPI_BASE_URL: "${MYAPI_BASE_URL:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      PUBLIC_DATA_API_KEY: "${PUBLIC_DATA_API_KEY:-}"
      USD_KRW_FALLBACK_RATE: "${USD_KRW_FALLBACK_RATE:-1360}"
    restart: unless-stopped
